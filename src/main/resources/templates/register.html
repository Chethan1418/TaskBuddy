<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join TaskBuddy</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="auth"><a class="brand" href="/">Task<span>Buddy</span> ✦</a><section class="panel stack"><h1>Create your space</h1><p class="muted">A few details and you're in.</p><p th:if="${message}" th:text="${message}" style="color:#c44"></p><form class="stack" method="post" action="/register" th:object="${form}"><input th:field="*{displayName}" placeholder="Your name" required minlength="2"><input th:field="*{email}" type="email" placeholder="Email address" required><input th:field="*{password}" type="password" placeholder="Password (at least 8 characters)" required minlength="8"><button class="btn">Create account</button></form><p class="center muted">Already have an account? <a href="/login">Log in</a></p></section></main><script src="/js/theme.js"></script></body></html>
