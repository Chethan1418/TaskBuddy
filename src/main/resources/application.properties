spring.application.name=taskbuddy
# Local persistent H2 database. Data is stored in ./data/taskbuddy.mv.db
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/taskbuddy;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
spring.h2.console.enabled=false
server.error.include-message=never
